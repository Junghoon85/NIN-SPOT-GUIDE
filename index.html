<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f10"><title>NIN SPOT Guide | Showcase</title>
<style>
:root{color-scheme:dark;--bg:#0b0f10;--panel:#11191a;--teal:#126e6d;--teal-deep:#06494b;--muted:#a5b5b2;--white:#f4f7f5}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif}button,a{font:inherit}a{color:inherit}.wrap{width:min(1380px,100%);margin:auto;padding-inline:clamp(18px,4vw,64px)}header{border-bottom:1px solid #ffffff18}.top{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:inline-flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.11em;text-decoration:none;font-size:17px}.pin{width:30px;height:30px;display:grid;place-items:center;border:1px solid #7bb5ac;border-radius:50%;color:#a5e2d7}.version{color:#849794;font-size:12px;letter-spacing:.13em}.intro{padding-block:clamp(48px,7vw,92px) 30px}.eyebrow{color:#8bbab3;font-size:11px;font-weight:700;letter-spacing:.23em}.intro h1{font-size:clamp(36px,5.4vw,72px);font-weight:600;letter-spacing:-.055em;margin:12px 0 12px;line-height:1.08}.intro p{color:#a8b6b2;font-size:clamp(14px,1.6vw,17px);margin:0;line-height:1.65}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:20px}.hint{font-size:12px;color:#7d9691}.arrows{display:flex;gap:8px}.arrow{background:#172121;color:#eaf3f0;border:1px solid #3a504d;border-radius:50%;height:40px;width:40px;cursor:pointer;font-size:22px}.arrow:hover{background:#25403d}.rail{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:clamp(14px,2.1vw,26px);padding:5px max(18px,calc((100vw - 1252px)/2)) 22px;scrollbar-width:thin;scrollbar-color:#42645e transparent}.showcase{width:min(370px,calc(100vw - 42px));flex:0 0 min(370px,calc(100vw - 42px));aspect-ratio:2/3;perspective:1300px;scroll-snap-align:center}.inner{height:100%;width:100%;position:relative;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.8,.2,1)}.showcase.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden;border:1px solid #ffffff25}.front{display:flex;flex-direction:column;background:#182323}.media{position:relative;flex:1;min-height:0;background:#080c0d;overflow:hidden}.thumb{width:100%;height:100%;object-fit:contain;display:block}.video-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:black}.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:1px solid #ffffff90;background:#000b;color:white;border-radius:50%;width:64px;height:64px;cursor:pointer;font-size:24px;display:grid;place-items:center}.play:hover{background:#126e6dee}.media-empty{height:100%;display:grid;place-items:center;text-align:center;padding:25px;color:#a8bdb7;font-size:13px}.front-caption{padding:18px 19px 17px;min-height:94px;cursor:pointer}.front-caption h2{margin:0 0 7px;font-size:19px;font-weight:600;line-height:1.25;letter-spacing:-.02em}.front-caption p{margin:0;color:#9fb2ac;font-size:12px}.flip-action{position:absolute;top:12px;right:12px;border:1px solid #ffffff70;background:#061313b9;color:white;border-radius:50%;width:35px;height:35px;cursor:pointer;z-index:2;display:grid;place-items:center;font-size:19px}.flip-action:hover{background:#176966}.back{transform:rotateY(180deg);background:var(--teal);display:flex;flex-direction:column;padding:clamp(17px,2vw,23px);gap:14px}.back h2{font-size:clamp(21px,2vw,25px);font-weight:650;line-height:1.15;letter-spacing:-.035em;margin:0;padding-right:25px}.back .desc{font-size:13px;line-height:1.65;color:#e2f0ed;margin:0}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{border:1px solid #b1d7d0a6;background:#ffffff12;border-radius:30px;padding:6px 10px;color:white;font-size:11px;text-decoration:none}.tag[href]:hover{background:#ffffff30}.facts{border-top:1px solid #ffffff50;padding-top:12px;display:grid;gap:10px}.fact{display:grid;grid-template-columns:95px minmax(0,1fr);gap:8px;align-items:start;font-size:12px}.fact-label{color:#c2dfd9}.fact-value{text-align:right;overflow-wrap:anywhere}.fact-value a{color:white;text-underline-offset:3px}.recipe-button{margin-top:auto;background:var(--teal-deep);border:1px solid #ffffff2b;border-radius:8px;color:white;text-align:left;padding:13px 15px;cursor:pointer;width:100%}.recipe-button strong{display:flex;justify-content:space-between;align-items:center;font-size:17px}.recipe-button small{display:block;color:#d0e6e1;margin-top:5px;font-size:11px;line-height:1.35}.recipe-button:hover{background:#033b3e}.recipe-panel{width:min(1000px,calc(100% - 36px));margin:22px auto 0;background:#102021;border:1px solid #2a5350;border-radius:12px;padding:clamp(20px,4vw,36px)}.recipe-panel[hidden]{display:none}.recipe-head{display:flex;justify-content:space-between;gap:16px;align-items:start}.recipe-head h2{font-size:clamp(24px,3vw,34px);letter-spacing:-.035em;margin:8px 0 0}.close{border:1px solid #5c8079;background:transparent;color:white;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:20px}.recipe-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:34px;margin-top:25px}.recipe-grid h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#a7d4cb;margin:0 0 16px}.steps{padding-left:22px;color:#d4e3df;line-height:1.7;font-size:14px}.steps li{padding:0 0 13px 4px}.guide-links{display:flex;flex-wrap:wrap;gap:9px}.guide-links a,.guide-links span{display:inline-flex;padding:9px 12px;border:1px solid #476d65;border-radius:6px;font-size:13px;text-decoration:none}.guide-links span{opacity:.65}.bottom-note{margin-top:70px;padding-block:36px;border-top:1px solid #ffffff19}.bottom-note p{max-width:700px;color:#a4b6b1;font-size:15px;line-height:1.7;margin:10px 0 0}footer{border-top:1px solid #ffffff19;margin-top:35px;padding-block:32px}.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap}.footer-links{display:flex;gap:11px;align-items:center;flex-wrap:wrap}.footer-links a{border:1px solid #34514b;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;text-decoration:none;font-size:12px;font-weight:700;color:#e5f2ed}.footer-links a:hover{background:#1a4944}.copyright{color:#849893;font-size:12px}.empty{padding:50px 20px;text-align:center;color:#a8bcb6}@media(max-width:650px){.top{height:66px}.intro{padding-top:48px}.recipe-grid{grid-template-columns:1fr;gap:18px}.hint{font-size:11px}.back{gap:11px}.fact{grid-template-columns:88px minmax(0,1fr)}.back .desc{font-size:12px}}

/* v0.3 revised: compact, viewport-aware, quiet iconography */
.top{height:54px}.brand{font-size:13px;letter-spacing:.07em;gap:9px}.spot-icon{display:grid;place-items:center;width:23px;height:23px;color:#79b8af}.spot-icon svg{width:23px;height:23px}.spot-shortcut{display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-size:11px;font-weight:650;letter-spacing:.04em;color:#9bc6bd}.spot-shortcut svg{width:15px;height:15px}.toolbar{padding-block:6px;min-height:40px}.arrow{width:30px;height:30px;font-size:19px;border-color:#253d39;background:transparent;color:#7eb0a7}.rail{padding-top:2px;padding-bottom:12px;gap:16px}.showcase{width:min(370px,calc(100vw - 40px),calc((100dvh - 155px)*2/3));flex-basis:min(370px,calc(100vw - 40px),calc((100dvh - 155px)*2/3));aspect-ratio:2/3}.front-caption{min-height:66px;padding:11px 14px 10px}.front-caption h2{font-size:16px;margin-bottom:4px}.front-caption p{font-size:11px}.flip-action{width:29px;height:29px;top:10px;right:10px;background:#0a2222aa;border:1px solid #7aaea55c;color:#d1e9e4;border-radius:7px}.flip-action svg{width:17px;height:17px}.back{padding:clamp(12px,2vh,20px);gap:clamp(7px,1.5vh,13px)}.back h2{font-size:clamp(17px,2.7vh,24px)}.back .desc{font-size:clamp(11px,1.6vh,13px);line-height:1.45}.facts{gap:clamp(5px,1.2vh,10px);padding-top:clamp(7px,1.2vh,12px)}.fact{font-size:clamp(10px,1.5vh,12px)}.tag{padding:4px 8px;font-size:10px}.recipe-button{padding:clamp(8px,1.5vh,13px) 12px}.recipe-button strong{font-size:15px}.recipe-button small{font-size:10px}.footer-links a{border:none;width:34px;height:34px;color:#79aaa1}.footer-links a svg{width:19px;height:19px}.footer-links a:hover{background:#123330;color:#b3ded6}.footer-links a.logo-link img{width:24px;height:24px;object-fit:contain}.footer-links a.logo-link{width:34px;height:34px}.footer-inner{gap:14px}footer{margin-top:18px;padding-block:19px}.footer-version{opacity:.45}
@media(max-width:650px){.top{height:50px}.rail{padding-bottom:6px}.showcase{width:min(calc(100vw - 36px),calc((100dvh - 145px)*2/3));flex-basis:min(calc(100vw - 36px),calc((100dvh - 145px)*2/3))}.footer-links{gap:7px}.footer-inner{justify-content:center}.copyright{text-align:center}.recipe-panel{margin-top:12px}.back{gap:7px}.fact{grid-template-columns:82px minmax(0,1fr)}}
@media(max-height:650px){.showcase{width:min(350px,calc((100dvh - 125px)*2/3));flex-basis:min(350px,calc((100dvh - 125px)*2/3))}.footer-version{display:none}}
</style>

<body>
<header><div class="wrap top"><a class="brand" href="#showcase" aria-label="NIN SPOT Guide"><span class="spot-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span>NIN SPOT GUIDE</span></a><a class="spot-shortcut" href="https://dns1.nin.earth/spot" target="_blank" rel="noopener noreferrer" aria-label="Open NIN SPOT">NIN SPOT <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 17 17 7M8 7h9v9"/></svg></a></div></header>

<script src="showcases.js"></script>
<script>
(()=>{
'use strict';
const items=Array.isArray(window.NIN_SHOWCASES)?window.NIN_SHOWCASES:[];
const guides=window.NIN_BASIC_GUIDES||{};
const rail=document.getElementById('rail'),panel=document.getElementById('recipePanel');
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n};
function youtubeId(url){if(!url)return '';try{const u=new URL(url);const host=u.hostname.replace(/^www\./,'');if(host==='youtu.be')return u.pathname.slice(1).split('/')[0];if(host==='youtube.com'||host==='m.youtube.com'||host==='youtube-nocookie.com'){if(u.pathname.startsWith('/shorts/')||u.pathname.startsWith('/embed/'))return u.pathname.split('/')[2];return u.searchParams.get('v')||''}}catch(e){}return ''}
function validUrl(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(e){return ''}}
function addFact(parent,label,value,url){if(!value)return;const row=el('div','fact'),lab=el('span','fact-label',label),v=el('span','fact-value');const safe=validUrl(url);if(safe){const a=el('a','',value+' ↗');a.href=safe;a.target='_blank';a.rel='noopener noreferrer';v.append(a)}else v.textContent=value;row.append(lab,v);parent.append(row)}
function stopPlayers(){rail.querySelectorAll('iframe.video-frame').forEach(frame=>{const media=frame.parentElement;frame.remove();const btn=media.querySelector('.play');if(btn)btn.hidden=false})}
function flip(card){stopPlayers();card.classList.toggle('flipped');}
function makeCard(item,index){const card=el('article','showcase'),inner=el('div','inner'),front=el('div','face front'),back=el('div','face back');const id=youtubeId(item.videoUrl);const media=el('div','media');if(id){const thumb=el('img','thumb');thumb.src='https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/hqdefault.jpg';thumb.alt='Video preview: '+(item.title||'Showcase');thumb.loading=index<2?'eager':'lazy';thumb.onerror=()=>{thumb.style.display='none';media.style.background='#132525'};media.append(thumb);const play=el('button','play','▶');play.type='button';play.setAttribute('aria-label','Play '+item.title);play.addEventListener('click',ev=>{ev.stopPropagation();stopPlayers();const iframe=el('iframe','video-frame');iframe.title=item.title||'Showcase video';iframe.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0&playsinline=1';iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';iframe.allowFullscreen=true;play.hidden=true;media.append(iframe)});media.append(play)}else{media.append(el('div','media-empty','Video URL to be added'))}front.append(media);const caption=el('div','front-caption');caption.append(el('h2','',item.title||'Untitled creation'));if(item.creator)caption.append(el('p','',item.creator));caption.addEventListener('click',()=>flip(card));front.append(caption);
const fbtn=el('button','flip-action');fbtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 5h13v14H3zM8 2h13v14h-3"/></svg>'; fbtn.type='button';fbtn.setAttribute('aria-label','Turn card over');fbtn.addEventListener('click',ev=>{ev.stopPropagation();flip(card)});front.append(fbtn);
back.append(el('h2','',item.title||'Untitled creation'));back.append(el('p','desc',item.description||''));const tags=el('div','tags');(item.tags||[]).forEach(t=>{const url=validUrl(guides[t]);const tag=el(url?'a':'span','tag','#'+t.replace(/\s+/g,''));if(url){tag.href=url;tag.target='_blank';tag.rel='noopener noreferrer'}tags.append(tag)});back.append(tags);const facts=el('div','facts');addFact(facts,'Creator',item.creator);addFact(facts,'Location',item.location);addFact(facts,'Domain Space',item.domainSpaceId?('#'+item.domainSpaceId):'',item.domainSpaceUrl);(item.objects||[]).slice(0,2).forEach((o,i)=>{if(o&&o.name)addFact(facts,i?'Object 2':'Object 1',o.name,o.url)});back.append(facts);const recipe=el('button','recipe-button');recipe.type='button';const strong=el('strong');strong.append(el('span','','Recipe'),el('span','','↘'));recipe.append(strong,el('small','','Discover how this creation was made.'));recipe.addEventListener('click',ev=>{ev.stopPropagation();showRecipe(item,index)});back.append(recipe);const bbtn=el('button','flip-action');bbtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 5h13v14H3zM8 2h13v14h-3"/></svg>'; bbtn.type='button';bbtn.setAttribute('aria-label','Turn card to front');bbtn.addEventListener('click',ev=>{ev.stopPropagation();flip(card)});back.append(bbtn);inner.append(front,back);card.append(inner);return card}
function showRecipe(item,index){panel.replaceChildren();const head=el('div','recipe-head'),titles=el('div');titles.append(el('div','eyebrow','CREATION RECIPE'),el('h2','',item.title||'Untitled creation'));head.append(titles);const close=el('button','close','×');close.type='button';close.setAttribute('aria-label','Close recipe');close.addEventListener('click',()=>{panel.hidden=true});head.append(close);panel.append(head);const grid=el('div','recipe-grid'),left=el('div'),right=el('div');left.append(el('h3','','How it was made'));const list=el('ol','steps');const details=Array.isArray(item.details)?item.details:[item.details];details.filter(Boolean).forEach(step=>list.append(el('li','',step)));if(!list.children.length)list.append(el('li','','Steps to be added.'));left.append(list);right.append(el('h3','','Basic Guides'));const links=el('div','guide-links');(item.tags||[]).forEach(t=>{const url=validUrl(guides[t]);const a=el(url?'a':'span','',t+(url?' ↗':''));if(url){a.href=url;a.target='_blank';a.rel='noopener noreferrer'}links.append(a)});right.append(links);grid.append(left,right);panel.append(grid);panel.hidden=false;panel.scrollIntoView({behavior:'smooth',block:'start'})}
if(!items.length)rail.append(el('div','empty','No showcases yet. Add an entry to showcases.js.'));else items.forEach((item,i)=>rail.append(makeCard(item,i)));
document.getElementById('prev').addEventListener('click',()=>rail.scrollBy({left:-Math.min(400,rail.clientWidth*.9),behavior:'smooth'}));document.getElementById('next').addEventListener('click',()=>rail.scrollBy({left:Math.min(400,rail.clientWidth*.9),behavior:'smooth'}));
})();
</script>
</body></html>
