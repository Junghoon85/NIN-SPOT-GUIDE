<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIN SPOT GUIDE</title><style>
:root{--teal:#008f91;--mint:#67ded1;--ink:#092326;--paper:#f3f8f6;--muted:#7b9998}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#06191c;color:#edf9f6;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,a{font:inherit}button{cursor:pointer}a{color:inherit}.site{max-width:560px;margin:auto;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#16494a 0%,#082427 38%,#06191c 75%);padding:18px 16px 34px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.logo{font-weight:850;letter-spacing:.13em;font-size:13px}.logo span{color:var(--mint)}.edition{font-size:10px;letter-spacing:.2em;color:#a6c5c2}.intro{display:flex;justify-content:space-between;align-items:end;margin:16px 0}.intro h1{font-size:clamp(27px,7vw,38px);letter-spacing:-.05em;line-height:1.08;margin:0}.intro p{font-size:12px;color:#a7c5c2;margin:7px 0 0}.count{font-size:12px;color:var(--mint)}.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:8px max(0px,calc((100% - min(82%,390px))/2)) 16px;overscroll-behavior-x:contain}.track::-webkit-scrollbar{display:none}.unit{flex:0 0 min(82%,390px);scroll-snap-align:center;min-width:0}.flip{width:100%;aspect-ratio:2/3;perspective:1400px;cursor:pointer;outline:none}.flip:focus-visible{outline:3px solid var(--mint);outline-offset:5px;border-radius:20px}.inner{height:100%;width:100%;position:relative;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.7,.2,1)}.flip.is-flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:19px;overflow:hidden;border:1px solid #477476;box-shadow:0 20px 40px #0007}.front{background:#0d3034;display:flex;flex-direction:column}.media{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(140deg,#104d53,#051c21)}.media img{width:100%;height:100%;object-fit:contain;position:relative;z-index:1}.media:before{content:"";position:absolute;inset:-18px;background-image:var(--bg);background-size:cover;background-position:center;filter:blur(22px) brightness(.4);opacity:.8}.play{position:absolute;z-index:2;border:1px solid #ffffff70;border-radius:100px;background:#061b1eb9;color:white;width:52px;height:52px;display:grid;place-items:center;font-size:20px}.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:3;background:#000}.media .watch-link{position:absolute;z-index:4;bottom:10px;right:10px;background:#062529dd;border:1px solid #ffffff55;padding:5px 9px;border-radius:30px;text-decoration:none;font-size:11px}.frontfoot{padding:15px 16px 17px;min-height:112px}.eyebrow{font-size:10px;color:var(--mint);letter-spacing:.15em}.frontfoot h2{font-size:19px;margin:4px 0;letter-spacing:-.03em}.meta{display:flex;justify-content:space-between;font-size:11px;color:#b5cecb}.back{transform:rotateY(180deg);background:linear-gradient(160deg,#dff7f1,#f8faf7);color:#153a3b;padding:22px;display:flex;flex-direction:column}.back .eyebrow{color:#007e7c}.back h2{font-size:27px;letter-spacing:-.05em;line-height:1.1;margin:20px 0 12px}.back p{font-size:14px;line-height:1.65}.back .spacer{flex:1}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.tag{border:1px solid #84bbb4;border-radius:20px;padding:4px 9px;color:#116a68;background:#ffffff70;font-size:11px}.expand{background:#007f80;color:white;border:0;padding:12px;border-radius:10px;font-weight:700;width:100%}.hint{font-size:11px;color:#9bbab6;text-align:center;margin:8px 0 12px}.controls{display:flex;align-items:center;justify-content:center;gap:18px}.nav{border:1px solid #497174;background:transparent;color:white;width:37px;height:37px;border-radius:50%}.dots{display:flex;gap:6px}.dot{width:6px;height:6px;background:#547475;border-radius:8px}.dot.active{width:23px;background:var(--mint)}.details{display:none;margin:20px 0 0;background:var(--paper);color:var(--ink);padding:24px 21px;border-radius:20px;animation:unfold .4s ease}.details.open{display:block}@keyframes unfold{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}.details h2{font-size:24px;letter-spacing:-.04em;margin:8px 0}.details h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#137d79;margin:22px 0 8px}.details p{color:#3d5c5c}.steps{padding-left:22px}.steps li{padding:5px 0}.guide{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #cadfda;text-decoration:none;font-size:13px}.guide span{color:#008582}.close{border:0;background:#dcebe6;border-radius:10px;padding:9px 12px;margin-top:20px}.submit{display:block;text-align:center;text-decoration:none;color:#c3dfdc;border:1px solid #376467;border-radius:11px;padding:12px;margin:25px 0 0;font-size:12px}.foot{font-size:10px;text-align:center;color:#799e9d;margin-top:16px}@media(min-width:800px){.site{margin:28px auto;border-radius:24px;min-height:calc(100vh - 56px)}}@media(prefers-reduced-motion:reduce){.inner{transition:none}html{scroll-behavior:auto}}

/* GitHub Pages full-width layout */
html,body{width:100%;min-height:100%;margin:0}
.site{max-width:none;width:100%;min-height:100svh;border-radius:0;padding:24px clamp(16px,3vw,48px) 40px}
.head,.intro,.controls,.hint,.foot{max-width:1400px;margin-left:auto;margin-right:auto}
.head{padding-bottom:14px;border-bottom:1px solid #ffffff20}
.logo{display:flex;align-items:center;gap:12px}
.brand-image{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px}
.intro{margin-top:36px;margin-bottom:26px}
.intro h1{font-size:clamp(38px,5vw,76px)}
.intro p{font-size:clamp(12px,1.4vw,16px)}
.track{gap:22px;padding:16px max(20px,calc((100% - 430px)/2)) 24px}
.unit{flex:0 0 min(430px,78vw)}
.details{max-width:860px;margin:24px auto}
@media(max-width:600px){.site{padding:14px 0 30px}.head{margin:0 16px}.intro{margin:22px 18px}.intro h1{font-size:clamp(34px,10vw,48px)}.brand-image{width:38px;height:38px}.edition{font-size:9px}.track{gap:14px;padding:8px 9% 16px}.unit{flex:0 0 82%}.details{margin:20px 12px}.foot{padding:0 12px}}
</style></head><body><main class="site"><header class="head"><div class="logo"><img src="nin-logo.png" alt="NIN logo" class="brand-image"><span>NIN SPOT GUIDE</span></div><div class="edition">THE LIVING CATALOG</div></header><div class="intro"><div><h1>See it.<br>Flip it.<br><span style="color:var(--mint)">Make it.</span></h1><p>Explore creations. Discover how they're made.</p></div><div class="count" id="counter">01 / 03</div></div><section class="track" id="track" aria-label="Showcase cards"></section><div class="hint">← Swipe to discover · Tap the card to flip →</div><div class="controls"><button class="nav" id="prev" aria-label="Previous showcase">‹</button><div class="dots" id="dots"></div><button class="nav" id="next" aria-label="Next showcase">›</button></div><section class="details" id="details" aria-live="polite"></section><a class="submit" href="mailto:hello@nin.earth?subject=NIN%20SPOT%20Showcase%20Submission">✦ &nbsp; Share your creation · Submit a Showcase</a><div class="foot">NIN.Earth · A guide you want to explore</div></main><script>
/* CONTENT EDITING: Replace sample records below with your showcase details. Use videoUrl for a YouTube link; other platforms open at their original URL. image can be any publicly accessible thumbnail URL. */
const showcases=[
{id:'001',title:'A Whale Above Seoul',creator:'NIN.Earth Team',views:null,location:'Seokchon Lake, Seoul',domainSpaceId:'Add Domain Space ID',domainSpaceUrl:'',videoUrl:'',image:'https://images.unsplash.com/photo-1568430462989-44163eb1752f?w=900',summary:'A giant whale in the sky above a real location. Discover how a 3D object can transform an everyday place into an AR experience.',steps:['Find a location in NIN SPOT.','Select the relevant Tile and Domain Space.','Install a 3D whale object.','Open AR mode to experience the result.'],tags:[{name:'#Search',url:''},{name:'#3DObject',url:''},{name:'#AR',url:''}]},
{id:'002',title:'The Red Flowerpot',creator:'NIN Story',views:null,location:'A real-world mystery',domainSpaceId:'Add Domain Space ID',domainSpaceUrl:'',videoUrl:'',image:'https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=900',summary:'A digital clue leads to a real-world discovery. A story that begins on your screen and continues at a physical location.',steps:['Choose a real location for the clue.','Place the 3D object at the selected spot.','Invite others to discover the clue through AR.'],tags:[{name:'#Search',url:''},{name:'#Install',url:''},{name:'#AR',url:''}]},
{id:'003',title:'Your Next Creation',creator:'Community Showcase',views:null,location:'Anywhere on Earth',domainSpaceId:'Add Domain Space ID',domainSpaceUrl:'',videoUrl:'',image:'https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=900',summary:'What would you create in a place that matters to you? This showcase is reserved for the next community contribution.',steps:['Imagine your creation.','Choose a real-world location.','Create and share your NIN SPOT experience.'],tags:[{name:'#Tile',url:''},{name:'#Share',url:''}]}
];
const track=document.getElementById('track'),details=document.getElementById('details'),dots=document.getElementById('dots');let selected=0,playing=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function youtubeId(url){try{const u=new URL(url);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('/')[0];if(u.hostname.includes('youtube.com'))return u.searchParams.get('v')||u.pathname.match(/\/(?:shorts|embed)\/([^/]+)/)?.[1]}catch(e){}return null}function render(){track.innerHTML=showcases.map((s,i)=>`<article class="unit" data-index="${i}"><div class="flip" tabindex="0" role="button" aria-label="Flip ${esc(s.title)} card"><div class="inner"><div class="face front"><div class="media" style="--bg:url('${esc(s.image)}')"><img src="${esc(s.image)}" alt="${esc(s.title)}" loading="lazy">${s.videoUrl?`<button class="play" aria-label="Play video">▶</button>`:'<span class="play" aria-hidden="true">↻</span>'}</div><div class="frontfoot"><div class="eyebrow">SHOWCASE NO. ${esc(s.id)}</div><h2>${esc(s.title)}</h2><div class="meta"><span>${esc(s.creator)}</span><span>${s.views==null?'':`◉ ${esc(s.views)} views`}</span></div></div></div><div class="face back"><div class="eyebrow">BEHIND THE CREATION · ${esc(s.id)}</div><h2>How was<br>it made?</h2><p>${esc(s.summary)}</p><div class="spacer"></div><div class="tags">${s.tags.map(t=>`<span class="tag">${esc(t.name)}</span>`).join('')}</div><button class="expand">Reveal the Recipe ↓</button><div style="font-size:10px;color:#568b87;text-align:center;margin-top:12px">Tap elsewhere to flip back</div></div></div></div></article>`).join('');dots.innerHTML=showcases.map((_,i)=>`<span class="dot ${i===0?'active':''}"></span>`).join('');track.querySelectorAll('.unit').forEach((unit,i)=>{const card=unit.querySelector('.flip');card.addEventListener('click',e=>{if(e.target.closest('.expand,.play,.watch-link,iframe'))return;card.classList.toggle('is-flipped');pauseVideo(unit)});card.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===card){e.preventDefault();card.click()}});unit.querySelector('.expand').addEventListener('click',e=>{e.stopPropagation();openDetails(i)});const play=unit.querySelector('.play');if(play&&showcases[i].videoUrl)play.addEventListener('click',e=>{e.stopPropagation();playVideo(unit,showcases[i])})});update()}
function playVideo(unit,s){const media=unit.querySelector('.media'),id=youtubeId(s.videoUrl);if(id){media.insertAdjacentHTML('beforeend',`<iframe title="${esc(s.title)}" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&mute=1&playsinline=1&rel=0" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>`)}else{window.open(s.videoUrl,'_blank','noopener,noreferrer')}}function pauseVideo(unit){unit.querySelector('iframe')?.remove()}function update(){document.getElementById('counter').textContent=`${String(selected+1).padStart(2,'0')} / ${String(showcases.length).padStart(2,'0')}`;dots.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===selected));track.querySelectorAll('.unit').forEach((u,i)=>{if(i!==selected)pauseVideo(u)})}function goto(i){selected=(i+showcases.length)%showcases.length;track.children[selected].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});details.classList.remove('open');update()}document.getElementById('prev').onclick=()=>goto(selected-1);document.getElementById('next').onclick=()=>goto(selected+1);let scrollTimer;track.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{const mid=track.getBoundingClientRect().left+track.clientWidth/2;let best=Infinity,idx=0;[...track.children].forEach((u,i)=>{const r=u.getBoundingClientRect(),d=Math.abs(r.left+r.width/2-mid);if(d<best){best=d;idx=i}});if(idx!==selected){selected=idx;details.classList.remove('open');update()}},80)},{passive:true});function openDetails(i){const s=showcases[i];details.innerHTML=`<div class="eyebrow" style="color:#008f91">CREATION RECIPE · ${esc(s.id)}</div><h2>${esc(s.title)}</h2><p>${esc(s.summary)}</p><h3>How it was made</h3><ol class="steps">${s.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><h3>Creator & Location</h3><p><b>Creator:</b> ${esc(s.creator)}<br><b>Location:</b> ${esc(s.location)}<br><b>Domain Space:</b> ${s.domainSpaceUrl?`<a href="${esc(s.domainSpaceUrl)}" target="_blank" rel="noopener noreferrer">${esc(s.domainSpaceId)} ↗</a>`:esc(s.domainSpaceId)}</p><h3>Official Basic Guides</h3>${s.tags.map(t=>t.url?`<a class="guide" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">${esc(t.name)} <span>Watch guide ↗</span></a>`:`<div class="guide">${esc(t.name)} <span>Link to be added</span></div>`).join('')}<button class="close">↑ Close Recipe</button>`;details.classList.add('open');details.querySelector('.close').onclick=()=>{details.classList.remove('open');track.scrollIntoView({behavior:'smooth',block:'start'})};details.scrollIntoView({behavior:'smooth',block:'start'})}render();
</script></body></html>
